services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: model_api_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  controlplane:
    build:
      context: ./services/controlplane
    env_file:
      - ./services/controlplane/.env.example
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  envoy:
    image: envoyproxy/envoy:v1.33-latest
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--service-cluster", "model-api-platform"]
    ports:
      - "8081:8081"
      - "9901:9901"
    volumes:
      - ./gateway/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - controlplane

volumes:
  postgres-data:
