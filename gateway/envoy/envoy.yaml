static_resources:
  listeners:
    - name: local_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: local_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        # route fragments:
                        # - gateway/envoy/routes/openai.yaml -> openai-compatible
                        # - gateway/envoy/routes/anthropic.yaml -> anthropic-compatible
                        # protocol prefixes referenced by the two fragments:
                        # /v1
                        # /anthropic
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 200
                            body:
                              inline_string: "envoy\n"
                http_filters:
                  - name: envoy.filters.http.router
  clusters: []
